name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      obi_version:
        description: OBI release to build against
        required: false
        default: v0.10.0

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Identical pipeline, identical component set. The only difference is
          # which patches are applied, so the variants can be compared directly
          # and each fix attributed on its own.
          - variant: patched
            patch_set: full
          - variant: envonly
            patch_set: env
          - variant: baseline
            patch_set: none
    steps:
      - uses: actions/checkout@v4

      # short:   commit SHA, so every build gets a tag that is never reused.
      #          See the tags: block below for why that matters.
      # contrib: otelcol-contrib version, read from manifest.yaml rather than
      #          hardcoded in the tag string. manifest.yaml is what actually
      #          builds the binary, so deriving it means the version tag cannot
      #          drift from the artefact it names -- bumping the distribution
      #          without touching this workflow no longer publishes an image
      #          labelled with the old version.
      - name: Resolve versions
        id: v
        run: |
          set -euo pipefail
          short=$(git rev-parse --short=7 HEAD)
          contrib=$(awk '/^dist:/{d=1;next} d&&/^  version:/{print $2;exit}' manifest.yaml)
          [ -n "$contrib" ] || { echo "could not read dist.version from manifest.yaml" >&2; exit 1; }
          echo "short=$short"     >> "$GITHUB_OUTPUT"
          echo "contrib=$contrib" >> "$GITHUB_OUTPUT"
          echo "contrib=$contrib short=$short"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            OBI_VERSION=${{ github.event.inputs.obi_version || 'v0.10.0' }}
            PATCH_SET=${{ matrix.patch_set }}
          # THE DEPLOYABLE TAG IS <variant>-sha-<short>. It is never reused, so
          # it is safe to reference from a manifest.
          #
          # The other two float: a rebuild repushes them onto new bytes. That is
          # a silent failure downstream, because these images are consumed
          # through an ECR pull-through cache, which caches by tag and does not
          # re-resolve a tag it has already seen. A repushed :patched leaves
          # nodes on the old image while the tag, the pod spec and the manifest
          # all still look correct.
          #
          # Pinning a digest instead does NOT work here: pull-through import is
          # tag-driven, so a digest ECR has never cached has no import path and
          # fails with "manifest unknown: Requested image not found". An
          # immutable tag is both the safe form and the readable one.
          #
          # So: deploy <variant>-sha-<short>; treat the floating tags as
          # human conveniences only, never as manifest references.
          tags: |
            ghcr.io/clode-labs/otel-collector-obi:${{ matrix.variant }}-sha-${{ steps.v.outputs.short }}
            ghcr.io/clode-labs/otel-collector-obi:${{ steps.v.outputs.contrib }}-obi-${{ github.event.inputs.obi_version || 'v0.10.0' }}-${{ matrix.variant }}
            ghcr.io/clode-labs/otel-collector-obi:${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
